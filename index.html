<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau Overtuig – reclame, inclusie en pitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2A44; --ink2:#3A4666; --paper:#FFF8EE; --paper2:#FBEFDD; --line:#E6DCCB;
  --tomato:#FF5A3C; --tomato-l:#FFE1D9; --tomato-d:#A3301A;
  --mustard:#FFC43D; --mustard-l:#FFF0C7; --mustard-d:#7A5300;
  --mint:#3DD6B5; --mint-l:#D6F5EC; --mint-d:#0B5345;
  --lila:#A78BFA; --lila-l:#ECE6FF; --lila-d:#4A2F9E;
  --sky:#7CC4FF; --sky-l:#E2F2FF; --sky-d:#0B4A7A;
  --display:'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);
  background:var(--paper);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);background-size:22px 22px;}
a{color:var(--tomato-d);font-weight:700}
a:hover{color:var(--tomato)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0 0 .5em}
button{font-family:var(--body);font-size:15px;cursor:pointer}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);border-bottom:3px solid var(--tomato)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;border-radius:50%;background:var(--tomato);display:grid;place-items:center;font-size:18px;transform:rotate(-8deg);border:2px solid var(--paper)}
.role{background:var(--mustard);color:var(--ink);font-family:var(--body);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;transform:rotate(-2deg)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px}
.saved{opacity:0;transition:opacity .3s;color:var(--mint)}
.saved.on{opacity:1}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:10px;font-weight:700;box-shadow:3px 3px 0 var(--tomato);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--tomato)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tomato)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn.light{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:3px 3px 0 var(--tomato)}
.btn.small{padding:5px 12px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-style:dashed}

/* applausmeter */
.meter{background:var(--ink2);padding:8px 22px 10px;display:flex;align-items:center;gap:14px;color:var(--paper);font-size:14px}
.meter-label{font-weight:700;white-space:nowrap}
.meter-track{flex:1;height:14px;background:#2A3554;border-radius:999px;overflow:hidden;position:relative;border:2px solid var(--paper)}
.meter-fill{height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--tomato) 0 12px,#FF7A60 12px 24px);transition:width .6s cubic-bezier(.3,1.4,.6,1)}
.meter-ticks{position:absolute;inset:0;display:flex;justify-content:space-evenly;pointer-events:none}
.meter-ticks span{width:2px;background:rgba(255,248,238,.35)}
.meter-pct{font-family:var(--display);font-weight:800;font-size:18px;min-width:52px;text-align:right}
.meter-mood{min-width:150px;color:var(--mustard);font-weight:700}

/* layout */
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;max-width:1360px;margin:0 auto;padding:24px 22px 80px}
.side{position:sticky;top:118px;align-self:start;max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}
.panel{background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);padding:14px 14px 12px;margin-bottom:18px}
.panel h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin-bottom:8px}
.route{list-style:none;margin:0;padding:0}
.route button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:0;padding:7px 8px;border-radius:10px;color:var(--ink);font-size:15px;line-height:1.25}
.route button:hover{background:var(--paper2)}
.route button.cur{background:var(--mustard-l);font-weight:700;outline:2px solid var(--mustard)}
.route .nr{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;background:#fff}
.route .done .nr{background:var(--mint);border-color:var(--mint-d);color:var(--mint-d)}
.route .teacher{margin-top:6px;border-top:2px dashed var(--line);padding-top:10px}
.scores{width:100%;border-collapse:collapse;font-size:14px}
.scores td{padding:4px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
.scores td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.scores tr.tot td{border-bottom:0;border-top:2px solid var(--ink);font-family:var(--display);font-size:16px;padding-top:7px}
.scores .na{color:#9A917F;font-weight:400}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.sticker{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px dashed var(--line);color:#A39A88;background:#fff}
.sticker.got{border-style:solid;transform:rotate(-2deg)}
.c-mint{background:var(--mint-l);border-color:var(--mint-d)!important;color:var(--mint-d)!important}
.c-mustard{background:var(--mustard-l);border-color:var(--mustard-d)!important;color:var(--mustard-d)!important}
.c-tomato{background:var(--tomato-l);border-color:var(--tomato-d)!important;color:var(--tomato-d)!important}
.c-lila{background:var(--lila-l);border-color:var(--lila-d)!important;color:var(--lila-d)!important}
.c-sky{background:var(--sky-l);border-color:var(--sky-d)!important;color:var(--sky-d)!important}

/* billboard hero */
.hero{position:relative;background:var(--ink);color:var(--paper);border-radius:18px;padding:30px 34px 28px;margin-bottom:26px;overflow:hidden;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--tomato)}
.hero:before{content:"";position:absolute;inset:8px;border:3px dotted var(--mustard);border-radius:12px;pointer-events:none;opacity:.7}
.kicker{display:inline-block;background:var(--tomato);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:6px;transform:rotate(-1.5deg);margin-bottom:12px}
.hero h1{font-size:clamp(28px,4vw,44px);font-weight:800;color:var(--mustard);letter-spacing:-1px}
.hero p{margin:0;max-width:760px;font-size:18px;color:#F2E9DA}
.hero-tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lpdtag{font-size:12px;font-weight:700;background:rgba(255,248,238,.12);border:1px solid rgba(255,248,238,.35);color:#F2E9DA;padding:3px 9px;border-radius:999px}
.hero-sticker{position:absolute;right:26px;top:22px;width:92px;height:92px;border-radius:50%;background:var(--mustard);color:var(--ink);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.1;padding:10px;transform:rotate(12deg);border:3px dashed var(--ink)}
.hero-sticker.got{background:var(--mint);}

/* blocks */
.block{background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);padding:22px 24px;margin-bottom:24px;position:relative}
.block h2{font-size:24px;font-weight:700;margin-top:4px}
.block h3{font-size:19px;margin-top:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:6px;border:2px solid;margin-bottom:6px}
.intro{color:var(--ink2)}
.note{background:var(--mustard-l);border-left:5px solid var(--mustard);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:16px}
.note.warn{background:var(--tomato-l);border-color:var(--tomato)}
.note.info{background:var(--sky-l);border-color:var(--sky)}
.kader{background:var(--mint-l);border:2px solid var(--mint-d);border-radius:12px;padding:14px 18px;margin:14px 0}
.kader h4{color:var(--mint-d);font-size:17px;margin-bottom:6px}
.kader ul{margin:4px 0 0;padding-left:20px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mini{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.mini b{font-family:var(--display)}
q{font-style:italic}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:12px}
.flip{border:2px solid var(--ink);border-radius:14px;min-height:150px;padding:14px;background:var(--paper);text-align:left;font-size:15px;line-height:1.45;position:relative;transition:transform .35s, background .2s;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.flip:hover{transform:rotate(-1deg) translateY(-2px)}
.flip .f-front{display:block}
.flip .f-back{display:none}
.flip.on{background:var(--ink);color:var(--paper);animation:flip .35s}
.flip.on .f-front{display:none}
.flip.on .f-back{display:block}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.f-big{font-family:var(--display);font-weight:800;font-size:28px;display:block;color:var(--tomato);margin-bottom:4px}
.f-title{font-family:var(--display);font-weight:700;font-size:18px;display:block}
.f-hint{position:absolute;bottom:8px;right:12px;font-size:12px;color:#8F8675}
.flip.on .f-hint{color:#C9C0B0}

/* links */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.link{display:block;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--sky-l);box-shadow:3px 3px 0 var(--ink);font-weight:400;transition:transform .1s}
.link:hover{transform:translate(-1px,-1px);color:var(--ink)}
.link b{display:block;font-family:var(--display);font-size:16px;color:var(--sky-d)}
.link small{display:block;color:var(--ink2);margin-top:4px;font-size:14px}
.link .arrow{float:right;font-weight:700;color:var(--sky-d)}

/* forms */
label.fl{display:block;font-weight:700;margin:14px 0 6px}
label.fl small{font-weight:400;color:var(--ink2)}
textarea,input[type=text],select{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);border:2px solid var(--ink2);border-radius:10px;padding:10px 12px;background:var(--paper)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--tomato);box-shadow:0 0 0 3px var(--tomato-l);background:#fff}
.wc{font-size:13px;color:var(--ink2);text-align:right;margin-top:2px}
.wc.ok{color:var(--mint-d);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* MC */
.q{border-top:2px dashed var(--line);padding:14px 0 6px}
.q:first-of-type{border-top:0}
.q-t{font-weight:700;margin-bottom:8px}
.q-t .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:13px;margin-right:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:2px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--paper);transition:border-color .15s}
.opt:hover{border-color:var(--ink2)}
.opt input{margin-top:5px;accent-color:var(--tomato);width:18px;height:18px;flex:0 0 18px}
.opt.sel{border-color:var(--ink);background:#fff}
.opt.ok{border-color:var(--mint-d);background:var(--mint-l)}
.opt.bad{border-color:var(--tomato-d);background:var(--tomato-l)}
.ex{font-size:15px;background:var(--lila-l);border-radius:8px;padding:8px 12px;margin-top:6px;color:var(--lila-d)}

/* categorize */
.cat-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-top:2px dashed var(--line)}
.cat-row:first-of-type{border-top:0}
.cat-t{font-size:16px}
.cat-t .n{font-family:var(--display);font-weight:800;color:var(--tomato);margin-right:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:2px solid var(--ink2);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.pill:hover{background:var(--paper2)}
.pill.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pill.ok{background:var(--mint);color:var(--mint-d);border-color:var(--mint-d)}
.pill.bad{background:var(--tomato-l);color:var(--tomato-d);border-color:var(--tomato-d);text-decoration:line-through}
.cat-fb{grid-column:1/-1;font-size:14px;margin-top:-4px}
.cat-fb.ok{color:var(--mint-d)} .cat-fb.bad{color:var(--tomato-d)}
.cat-row select.ok{border-color:var(--mint-d);background:var(--mint-l)}
.cat-row select.bad{border-color:var(--tomato-d);background:var(--tomato-l)}

/* gap */
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px;padding:10px;border:2px dashed var(--ink2);border-radius:12px;background:var(--paper)}
.bank span{background:var(--mustard-l);border:2px solid var(--mustard-d);color:var(--mustard-d);font-weight:700;font-size:14px;padding:2px 10px;border-radius:8px}
.bank span.used{opacity:.35;text-decoration:line-through}
.gaptext{line-height:2.3;font-size:17px}
.gaptext input{width:auto;min-width:130px;display:inline-block;padding:3px 8px;font-size:16px;border-radius:8px;border-width:2px;margin:0 2px}
.gaptext input.ok{border-color:var(--mint-d);background:var(--mint-l)}
.gaptext input.bad{border-color:var(--tomato-d);background:var(--tomato-l)}
.gapfix{font-size:13px;color:var(--mint-d);font-weight:700;margin-right:4px}

/* check bar */
.checkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:2px solid var(--ink)}
.err{color:var(--tomato-d);font-size:14px;font-weight:700}
.scorebadge{font-family:var(--display);font-weight:800;font-size:20px;background:var(--mustard);border:2px solid var(--ink);padding:4px 14px;border-radius:999px;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--ink)}
.scorebadge.full{background:var(--mint)}
.cheer{font-weight:700;color:var(--ink2)}

/* reading */
.mag{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:24px 28px;columns:2 300px;column-gap:34px;column-rule:1px solid var(--line);font-size:16px}
.mag h3{column-span:all;font-size:28px;font-weight:800;margin:0 0 6px}
.mag .lead{column-span:all;font-weight:700;font-size:18px;color:var(--ink2);margin-bottom:14px}
.mag h4{font-size:17px;margin:12px 0 4px;color:var(--tomato-d)}
.mag p{margin:0 0 10px}
.mag .meta{column-span:all;font-size:13px;color:#8F8675;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}

/* pitchcard */
.pcard{background:var(--mustard);border:3px solid var(--ink);border-radius:16px;padding:20px 22px;transform:rotate(-.6deg);box-shadow:6px 6px 0 var(--ink)}
.pcard .pc-prod{font-family:var(--display);font-weight:800;font-size:26px}
.pcard .pc-slogan{font-family:var(--display);font-size:20px;font-style:italic;background:var(--ink);color:var(--mustard);display:inline-block;padding:4px 12px;border-radius:8px;margin:6px 0 12px;transform:rotate(-1deg)}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pc-step{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;min-height:80px}
.pc-step b{display:block;font-family:var(--display);color:var(--tomato-d);font-size:15px}
.pc-empty{color:#A39A88;font-style:italic}

/* timer */
.timer{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:800;font-size:56px;background:var(--ink);color:var(--paper);padding:6px 22px;border-radius:14px;min-width:190px;text-align:center;border:3px solid var(--ink)}
.clock.short{color:var(--mustard)} .clock.good{color:var(--mint)} .clock.long{color:var(--tomato)}
.zone{font-weight:700}
.tbar{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--mustard) 0 50%,var(--mint) 50% 100%);position:relative;margin:10px 0 4px;border:2px solid var(--ink);max-width:520px}
.tbar i{position:absolute;top:-6px;width:4px;height:20px;background:var(--ink);left:0;transition:left .3s}
.tlegend{display:flex;justify-content:space-between;max-width:520px;font-size:12px;color:var(--ink2)}

/* rubric */
.rubwrap{overflow-x:auto}
.rub{width:100%;border-collapse:separate;border-spacing:6px;min-width:820px;font-size:14px;line-height:1.35}
.rub th{font-family:var(--display);text-align:left;padding:6px 8px;font-size:15px}
.rub td.crit{font-weight:700;width:150px;vertical-align:top;padding:8px}
.rub td.cell{border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;vertical-align:top;background:var(--paper);position:relative;transition:border-color .15s}
.rub td.cell:hover{border-color:var(--ink2)}
.rub td.self{background:var(--mint-l);border-color:var(--mint-d)}
.rub td.peer{box-shadow:inset 0 0 0 3px var(--lila)}
.rub .tagme,.rub .tagpeer{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin:0 4px 4px 0}
.rub .tagme{background:var(--mint-d);color:#fff}
.rub .tagpeer{background:var(--lila-d);color:#fff}
.modes{display:flex;gap:8px;margin:10px 0}
.modes button{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;background:#fff;font-weight:700}
.modes button.on{background:var(--ink);color:var(--paper)}

/* nav bottom */
.secnav{display:flex;justify-content:space-between;gap:12px;margin-top:10px}

/* finish */
.finish{text-align:center}
.finish .big{font-family:var(--display);font-weight:800;font-size:64px;color:var(--tomato)}
.finish .stickers{justify-content:center;margin:14px 0}

/* lpd table */
.lpd{width:100%;border-collapse:collapse;font-size:15px}
.lpd th,.lpd td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.lpd th{background:var(--ink);color:var(--paper);font-family:var(--display)}
.lpd tr:nth-child(even) td{background:var(--paper)}
.cov{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:2px solid}

/* toggle side mobile */
.sidetoggle{display:none}
#main:focus{outline:none}
@media (max-width:980px){
  .top{position:static}
  .top-in{padding:10px 14px}
  .meter{padding:8px 14px}
  .wrap{grid-template-columns:1fr;padding:16px 12px 60px}
  .side{position:static;max-height:none;display:none}
  .side.open{display:block}
  .sidetoggle{display:inline-block}
  .hero{padding:24px 20px}
  .hero-sticker{display:none}
  .cat-row{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .meter-mood{display:none}
  .block{padding:18px 16px}
}

/* report (print) */
#report{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  .top,.meter,.wrap{display:none!important}
  #report{display:block;color:#111;font-family:var(--body)}
  #report h1{font-family:var(--display);font-size:22pt;margin:0}
  #report h2{font-family:var(--display);font-size:15pt;margin:18pt 0 6pt;border-bottom:2pt solid #1F2A44;padding-bottom:3pt;page-break-after:avoid}
  #report h3{font-size:12pt;margin:10pt 0 4pt;page-break-after:avoid}
  #report .ans{border-left:3pt solid #FFC43D;padding:3pt 8pt;margin:2pt 0 6pt;white-space:pre-wrap}
  #report .lbl{font-weight:700;margin-top:5pt}
  #report table{border-collapse:collapse;width:100%;margin:6pt 0;font-size:10pt}

  { type:'html', chip:'Theorie', title:'Storytelling, advertorial en testimonial', html:`
    <p>Mensen zijn dol op verhalen: als kind verzinnen we verhalen in ons hoofd, later verliezen we ons in boeken, films en liedjes. Merken spelen daarop in met <b>storytelling</b>: ze vertellen het oprechte verhaal achter hun bedrijf of product. Zo krijgt een merk een gezicht in plaats van een koele, zakelijke uitstraling.</p>

    html:`<div class="mag">
      <div class="meta">Jong &amp; Bezig · rubriek School</div>
      <h3>Studeren zonder stress? Zo pakt de nieuwe generatie het aan</h3>
      <div class="lead">De examens komen eraan en in veel huiskamers stijgt de spanning. Toch merken ouders en leerkrachten een opvallende verschuiving: steeds meer jongeren plannen hun leerwerk slimmer en houden zo tijd over voor sport, vrienden en slaap.</div>
      <h4>Een plan dat met je meedenkt</h4>
      <p>Wie het geheim achter die nieuwe aanpak zoekt, komt al snel uit bij StudieKompas, een app die twee Gentse studenten ontwikkelden op hun studentenkot. "We zaten zelf met onze handen in het haar tijdens de blok," vertelt medeoprichter Ilias. "Dus bouwden we de tool die we zelf hadden willen hebben."</p>
      <p>Het resultaat is een digitale planner die je leerstof automatisch verdeelt over de dagen die je nog hebt en die je planning bijstuurt als je een dag achterop raakt.</p>
      <h4>Rust in je hoofd</h4>
      <p>Experts zijn het erover eens dat overzicht de beste remedie is tegen examenstress. Onderzoek toont aan dat jongeren die met een vaste planning werken, beter slapen en hogere punten halen. Ook bij gebruikers van StudieKompas is dat effect duidelijk zichtbaar.</p>

  blocks:[
  { type:'html', chip:'Theorie', title:'Spelen met taal en taalvariëteiten', html:`
    <p>Reclamemakers kiezen hun woorden heel bewust. Positieve adjectieven en werkwoorden scheppen een aantrekkelijk beeld (<b>framing</b>). Ook de <b>taalvariëteit</b> is een keuze: Standaardnederlands klinkt betrouwbaar en neutraal, tussentaal of straattaal klinkt informeel, grappig of verrassend en creëert nabijheid.</p>
    <p>Een voorbeeld: in een spot van Douwe Egberts spreken oma's Nederlandse straattaal. De slogan luidt: <q>Douwe Egberts, da's andere koffie.</q></p>
    <a class="link" style="max-width:420px" href="${YT('Douwe Egberts reclame oma straattaal andere koffie')}" target="_blank" rel="noopener"><span class="arrow">↗</span><b>Bekijk de spot van Douwe Egberts</b><small>Let op het taalgebruik van de oma's en op de slogan.</small></a>` },
  { type:'mc', id:'de', chip:'Oefening', title:'Da\'s andere koffie', intro:`Beantwoord de vragen over de spot en de slogan van Douwe Egberts.`,
    qs:[
      {q:`Waarom koos de maker ervoor om de oma's straattaal te laten spreken?`,o:[`Omdat oma's in werkelijkheid zo praten`,`Omdat het taalgebruik 'anders' is, net als de koffie: dat sluit aan bij de slogan`,`Omdat straattaal goedkoper is om op te nemen`,`Omdat de spot alleen voor Nederlanders bedoeld is`],a:1},
      {q:`Wat is het effect van het informele 'da's' in de slogan?`,o:[`Het klinkt afstandelijk en formeel.`,`Het creëert een gevoel van nabijheid en vertrouwdheid.`,`Het maakt de slogan moeilijk te verstaan.`,`Het is een spelfout die niemand opmerkt.`],a:1},

  { type:'html', chip:'Theorie', title:'Inclusieve communicatie', html:`
    <div class="kader"><h4>Wat is inclusieve communicatie?</h4>
    <p style="margin:0">Inclusieve communicatie wil zoveel mogelijk mensen bereiken en houdt daarom rekening met de <b>diversiteit</b> van het doelpubliek. Het tegenovergestelde is <b>exclusieve communicatie</b>. De kernvraag: houd je voldoende rekening met gender, seksuele geaardheid, etniciteit, leeftijd, mogelijke beperkingen …? Inclusieve communicatie probeert positief en <b>vrij van stereotypen</b> te zijn.</p></div>
    <h3>Lees eerst dit nieuwsbericht</h3>
    <div class="mag" style="columns:1"><h3 style="font-size:22px">Belgisch koffiespotje gaat wereldwijd viraal</h3>
    <p>Een Belgische reclame van koffiemerk Douwe Egberts is in amper een week meer dan 12 miljoen keer bekeken op X. In het ontroerende filmpje probeert een meisje haar lief angstvallig te verbergen voor haar vader, maar dat blijkt helemaal niet nodig.</p>
    <p>Douwe Egberts Belgium zette het spotje in januari online. Een Vlaamse kijkster deelde het een paar dagen later, waarna een Amerikaanse het oppikte. Vanaf dan ging het snel: honderdduizenden likes en shares, en ook bekende namen zoals actrice Jameela Jamil verspreidden het filmpje.</p></div>
    <p style="font-size:13px;color:#8F8675">Nieuwsbericht herschreven voor deze oefening.</p>
    <a class="link" style="max-width:420px" href="${YT('Douwe Egberts reclame meisje verbergt lief voor vader')}" target="_blank" rel="noopener"><span class="arrow">↗</span><b>Bekijk daarna het spotje van Douwe Egberts</b><small>Een meisje verbergt haar lief voor haar vader …</small></a>` },

    qs:[
      {q:`Wat is een kernprincipe van inclusief taalgebruik?`,o:[`Het vermijden van complexe woorden en jargon`,`Het gebruik van taal die niemand onbewust uitsluit en die diversiteit weerspiegelt`,`Het uitsluiten van bepaalde doelgroepen om de boodschap te verduidelijken`,`Het handhaven van traditionele taalstructuren om misverstanden te voorkomen`],a:1},

/* ---------- 5 IEDEREEN AAN BOORD ---------- */
{ id:'aanboord', nr:'5', short:'Iedereen aan boord', kicker:'Briefing 5 · Les 31', title:'Iedereen aan boord',
  sub:`Taal kan kwetsen, ook als het niet zo bedoeld is. Denk na over taalgevoeligheden en weeg verschillende taalinclusieve oplossingen tegen elkaar af.`,
  lpd:['1','2','6','7+','9','10','11','13'], sticker:{name:'Taalkompas', c:'c-sky'},
  blocks:[
  { type:'html', chip:'Situatie', title:'Weg met lelijk of dik?', html:`
    <p>De Britse uitgeverij van de kinderboeken van Roald Dahl bracht honderden wijzigingen aan in een nieuwe druk. Het gaat vooral over beschrijvingen van het uiterlijk van personages en over genderspecifieke woorden. Zo werd een personage dat 'dik' was nu 'enorm'. Een <b>sensitivity reader</b> nam de boeken door.</p>
    <p>Op sociale media leidde dat tot een felle discussie. Sommigen spreken van censuur, anderen vinden het logisch dat kinderboeken die nog altijd populair zijn met hun tijd meegaan. De Nederlandse uitgeverij De Fontein reageerde kritisch: volgens haar zitten Dahls humor en kracht net in de overdrijvingen.</p>
    <a class="link" style="max-width:520px" href="https://www.vrt.be/vrtnws/nl/2023/02/19/roald-dahl-boeken-aangepast-beledigend-taalgebruik/" target="_blank" rel="noopener"><span class="arrow">↗</span><b>Lees het artikel op VRT NWS: Weg met "lelijk" of "dik"</b><small>Let op de reacties: wie is voor, wie is tegen, en waarom?</small></a>` },
  { type:'cat', id:'tschema', chip:'Oefening', title:'T-schema: voor of tegen de aanpassingen?', intro:`Zijn deze argumenten <b>voor</b> of <b>tegen</b> het aanpassen van de boeken?`,
    cats:['Voor de aanpassingen','Tegen de aanpassingen'],
    items:[
      {t:`Je moet je niet vastklampen aan teksten alleen omdat Dahl ze geschreven heeft.`,a:0},
      {t:`Met de originele teksten van een schrijver mag je niet knoeien.`,a:1},
      {t:`De essentie en vindingrijkheid van Dahl blijven gewoon behouden.`,a:0},
      {t:`Dahl gaf in zijn verhalen zelf al duiding bij gevoelige woorden.`,a:1},
      {t:`Waarom is het een drama als er rekening wordt gehouden met mensen die wél gekwetst zijn?`,a:0},
      {t:`'Dik' en 'enorm' betekenen ongeveer hetzelfde: wat is dan het nut?`,a:1},
      {t:`Dahl paste zelf ook al zijn boeken aan, bijvoorbeeld de beschrijving van de Oompa Loompa's.`,a:0},
      {t:`Dit is gewoon censuur.`,a:1},
      {t:`Stereotypering hoort bij zijn humor: dat maakt de boeken tijdloos en krachtig.`,a:1}
    ]},
  { type:'html', chip:'Theorie', title:'Censuur en sensitivity readers', html:`
    <div class="kader"><h4>Censuur</h4>
    <p style="margin:0 0 6px">Als een <b>gezagsinstantie</b> (bijvoorbeeld een overheid of een kerkelijke instantie) beslist om uitingen te verbieden omwille van de inhoud, spreek je van censuur. Het doel is meestal om afwijkende meningen te onderdrukken.</p>
    <ul><li><b>Preventieve censuur:</b> vóór de publicatie wordt gecontroleerd of alles aan de regels voldoet.</li>
    <li><b>Repressieve censuur:</b> na de publicatie wordt verdere verspreiding verboden.</li></ul>
    <p style="margin:6px 0 0">De Belgische grondwet beschermt de vrijheid van meningsuiting, maar censuur kan wel als uitlatingen ingaan tegen de verdragen van de Verenigde Naties, bijvoorbeeld als ze tot haat aanzetten.</p></div>
    <p>Een <b>sensitivity reader</b> gaat na of bepaalde maatschappelijke groepen een publicatie als kwetsend zouden kunnen ervaren.</p>` },
  { type:'cat', id:'censuur', chip:'Oefening', title:'Censuur of niet?', intro:`Pas de definitie toe. Let goed op wíé de beslissing neemt.`,
    cats:['Preventieve censuur','Repressieve censuur','Geen censuur (strikt genomen)'],

  { type:'html', chip:'Zoekopdracht', title:'Sarah in Wokeland', html:`
    <p>Bekijk het fragment uit het VRT-programma <i>Sarah in Wokeland</i>. Sarah gaat langs bij Rik, de eigenaar van een busmaatschappij met het woord 'zigeuner' in de naam.</p>
    <div class="note warn">Let op: in dit fragment gaat het over een woord dat veel mensen als kwetsend ervaren. We bespreken het hier om te begrijpen wat woorden doen bij verschillende groepen, niet om het te gebruiken.</div>
    <a class="link" style="max-width:420px" href="${GG('Sarah in Wokeland VRT MAX')}" target="_blank" rel="noopener"><span class="arrow">↗</span><b>Zoek Sarah in Wokeland op VRT MAX</b><small>Bekijk het fragment over de busmaatschappij.</small></a>` },

  { type:'open', id:'abc', chip:'Zelf doen', title:'Afwegen met de ABC-formule', intro:`Hoe onthalen verschillende groepen het woord? Kies daarna een kant (voor of tegen het gebruik van de naam door de busmaatschappij) en pas de ABC-formule toe.<div class="kader"><h4>De ABC-formule</h4><ul style="margin:0"><li><b>A</b> · Wat is de situatie?</li><li><b>B</b> · Waarom is dat een probleem, en voor wie?</li><li><b>C</b> · Is het probleem op te lossen? Hoe? Formuleer een concrete oplossing.</li></ul></div>`,

  ['LPD 11','Inzicht in taalgebruik (communicatiemodel, register, vaste tekststructuren, humor)','AIDA, persuasieve teksttypes, advertorial/testimonial, framing, retorica, prosodie','1–7, exit','sterk'],
  ['LPD 12','Inzicht in het taalsysteem (klank, woord, betekenis)','Beginrijm en rijm, woordspeling, genderneutrale woordvorming, stijlfiguren','3, 5, 6','gedekt'],
  ['LPD 13','Woordenschat inzetten (school- en vaktaal)','Gap fills vaktaal reclame en inclusie, begrippen ethos/logos/pathos, censuur, sensitivity reader','2–6, exit','sterk'],
  ['LPD 14','Strategieën inzetten','Leesstrategie bij de leestest, stappenplan pitch, werkpunt, oefentimer, zelfevaluatie met rubric','0, 2, 7, 8','sterk']
];

/* ================= STATE ================= */
const KEY = 'bureauOvertuig_v1';
let S = {ans:{}, ex:{}, rub:{}, cur:'welkom', rubMode:'self', timer:{}};
try{ const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); const s=document.getElementById('saved'); s.classList.add('on'); setTimeout(()=>s.classList.remove('on'),1200);}catch(e){}
  },250);
}

const BLOCKS = {};
SECTIONS.forEach(s=>s.blocks.forEach(b=>{ if(b.id) BLOCKS[b.id]=b; b._sec=s.id; }));

const esc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent; };
const words = t => (t||'').trim().split(/\s+/).filter(Boolean).length;
const norm = t => (t||'').toLowerCase().trim().replace(/[.,;:!?'"]/g,'').replace(/\s+/g,' ');
const fid = (b,f) => b.id+'.'+f.id;

/* gap parse */
function gapParts(b){
  const parts=[]; const re=/\{\{(.*?)\}\}/g; let m, last=0, k=0;
  while((m=re.exec(b.text))){ parts.push({t:b.text.slice(last,m.index)}); parts.push({g:k++, alts:m[1].split('|')}); last=re.lastIndex; }
  parts.push({t:b.text.slice(last)}); return parts;
}

/* ================= TASKS & PROGRESS ================= */
function isDone(b){
  if(['mc','cat','gap'].includes(b.type)) return !!S.ex[b.id];
  if(b.type==='open') return b.fields.every(f=>(S.ans[fid(b,f)]||'').trim().length>0);
  if(b.type==='rubric') return RUBRIC.crit.every((c,i)=>S.rub[i] && S.rub[i].self!=null);
  return null;
}
function tasksOf(sec){ return sec.blocks.filter(b=>isDone(b)!==null); }
function secDone(sec){ const t=tasksOf(sec); return t.length>0 && t.every(isDone); }
function progress(){
  let tot=0, d=0;
  SECTIONS.filter(s=>!s.teacher).forEach(s=>tasksOf(s).forEach(b=>{tot++; if(isDone(b)) d++;}));
  return tot? Math.round(d/tot*100):0;
}
const MOODS=[[0,'stilte in de zaal'],[1,'iemand kucht'],[15,'beleefd applaus'],[40,'luid applaus'],[65,'gejoel in de zaal'],[90,'bijna een ovatie'],[100,'staande ovatie!']];

function updateChrome(){
  const p=progress();
  document.getElementById('meterFill').style.width=p+'%';
  document.getElementById('meterPct').textContent=p+'%';
  document.getElementById('meterbar').setAttribute('aria-valuenow',p);
  let mood=MOODS[0][1]; MOODS.forEach(m=>{ if(p>=m[0]) mood=m[1]; });
  document.getElementById('meterMood').textContent=mood;
  const n=S.ans['id.naam'], k=S.ans['id.klas'];
  document.getElementById('who').textContent = n ? (n+(k?' · '+k:'')) : '';
  // route
  document.getElementById('route').innerHTML = SECTIONS.map(s=>`<li class="${s.teacher?'teacher':''}"><button data-go="${s.id}" class="${S.cur===s.id?'cur':''} ${!s.teacher&&secDone(s)?'done':''}"><span class="nr">${!s.teacher&&secDone(s)?'✓':s.nr}</span><span>${esc(s.short)}</span></button></li>`).join('');
  // scores
  let rows='', ts=0, tm=0;
  SECTIONS.forEach(s=>s.blocks.forEach(b=>{
    if(!['mc','cat','gap'].includes(b.type)) return;
    const max = maxOf(b); tm+=max;
    const r=S.ex[b.id];
    if(r) ts+=r.score;
    rows+=`<tr><td>${esc(strip(b.title))}</td><td>${r? r.score+'/'+max : '<span class="na">–/'+max+'</span>'}</td></tr>`;
  }));
  rows+=`<tr class="tot"><td>Totaal</td><td>${ts}/${tm}</td></tr>`;
  document.getElementById('scores').innerHTML=rows;
  // stickers
  document.getElementById('stickers').innerHTML = stickerHTML();
  const hs=document.querySelector('.hero-sticker');
  if(hs){ const sec=SECTIONS.find(s=>s.id===S.cur); if(sec&&!sec.teacher){ hs.classList.toggle('got',secDone(sec)); hs.innerHTML=secDone(sec)?'✓<br>'+esc(sec.sticker.name):'sticker:<br>'+esc(sec.sticker.name);} }
  const fin=document.getElementById('finishBox'); if(fin) fin.innerHTML=finishInner();
}
function stickerHTML(){
  return SECTIONS.filter(s=>!s.teacher).map(s=>`<span class="sticker ${secDone(s)?'got '+s.sticker.c:''}">${secDone(s)?'★ ':''}${esc(s.sticker.name)}</span>`).join('');
}
function maxOf(b){ return b.type==='mc'?b.qs.length : b.type==='cat'?b.items.length : gapParts(b).filter(p=>p.g!=null).length; }
function totals(){ let ts=0,tm=0; Object.values(BLOCKS).forEach(b=>{ if(['mc','cat','gap'].includes(b.type)){ tm+=maxOf(b); if(S.ex[b.id]) ts+=S.ex[b.id].score; } }); return [ts,tm]; }

/* ================= RENDER ================= */
function chip(b){
  const map={'Theorie':'c-lila','Oefening':'c-mint','Zelf doen':'c-mustard','Zoekopdracht':'c-tomato','Leestekst':'c-sky','Bronnen':'c-sky','Quiz':'c-mustard','Reflectie':'c-lila','Interactie':'c-tomato','Zelfevaluatie':'c-mint','Spiekbriefje':'c-mustard','Opwarmer':'c-mustard','Situatie':'c-sky','Zo werkt het':'c-sky'};
  const c = map[b.chip] || 'c-mustard';
  return b.chip?`<span class="chip ${c}">${esc(b.chip)}</span>`:'';
}
function head(b){ return `${chip(b)}${b.title?`<h2>${b.title}</h2>`:''}${b.intro?`<p class="intro">${b.intro}</p>`:''}`; }

function rHtml(b){ return `<section class="block">${head(b)}${b.html}</section>`; }
function rReading(b){ return `<section class="block">${head(b)}${b.html}</section>`; }
function rFlip(b){
  return `<section class="block">${head(b)}<div class="flips">${b.cards.map((c,i)=>`<button class="flip" data-flip aria-label="Draai kaart ${esc(c.t)} om"><span class="f-front">${c.big?`<span class="f-big">${c.big}</span>`:''}<span class="f-title">${esc(c.t)}</span></span><span class="f-back">${c.b}</span><span class="f-hint">↻ draai om</span></button>`).join('')}</div></section>`;
}
function rLinks(b){
  return `<section class="block">${head(b)}<div class="links">${b.items.map(l=>`<a class="link" href="${l.u}" target="_blank" rel="noopener"><span class="arrow">↗</span><b>${esc(l.l)}</b><small>${esc(l.s)}</small></a>`).join('')}</div></section>`;
}
function rOpen(b){
  const fs=b.fields.map(f=>{
    const id=fid(b,f), v=S.ans[id]||'';
    const ctl = f.input ? `<input type="text" id="${id}" data-f="${id}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`
      : `<textarea id="${id}" data-f="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}" ${f.words?`data-words="${f.words.join(',')}"`:''}>${esc(v)}</textarea>`;
    return `<label class="fl" for="${id}">${esc(f.label)}</label>${ctl}${f.words?`<div class="wc" data-wc="${id}">${wcText(v,f.words)}</div>`:''}`;
  }).join('');
  return `<section class="block" data-block="${b.id}">${head(b)}${fs}</section>`;
}
function wcText(v,w){
  const n=words(v); const [mn,mx]=w;
  const target = mx? `${mn}–${mx}` : `min. ${mn}`;
  return `Woorden: ${n} / ${target}`;
}
function wcOk(v,w){ const n=words(v); return n>=w[0] && (!w[1]||n<=w[1]); }

function checkBar(b){
  const r=S.ex[b.id];
  if(r){
    const max=maxOf(b); const full=r.score===max;
    const cheer = full?'Perfect, de zaal gaat uit de bol!': r.score/max>=.6?'Goed bezig! Bekijk de feedback.':'Lees de feedback en probeer opnieuw.';
    return `<div class="checkbar"><span class="scorebadge ${full?'full':''}">${r.score}/${max}</span><span class="cheer">${cheer}</span><button class="btn alt small" data-retry="${b.id}">↺ Opnieuw proberen</button></div>`;
  }
  return `<div class="checkbar"><button class="btn" data-check="${b.id}">Verbeter</button><span class="err" data-err="${b.id}"></span></div>`;
}
function rMC(b){
  const r=S.ex[b.id];
  const qs=b.qs.map((q,i)=>{
    const name=b.id+'_'+i, sel=S.ans[name];
    const opts=q.o.map((o,k)=>{
      let cls = sel==k?'sel':'';
      if(r){ if(k===q.a) cls='ok'; else if(sel==k) cls='bad'; }
      return `<label class="opt ${cls}"><input type="radio" name="${name}" value="${k}" data-f="${name}" ${sel==k?'checked':''} ${r?'disabled':''}><span>${esc(o)}</span></label>`;
    }).join('');
    const ex = r ? `<div class="ex">${sel==q.a?'✓ Juist.':'✗ Het juiste antwoord: '+esc(q.o[q.a])+'.'}${q.ex?' '+esc(q.ex):''}</div>`:'';
    return `<div class="q"><div class="q-t"><span class="n">${i+1}</span>${esc(q.q)}</div>${opts}${ex}</div>`;
  }).join('');
  return `<section class="block" data-block="${b.id}">${head(b)}${qs}${checkBar(b)}</section>`;
}
function isRight(item, v){ return Array.isArray(item.a)? item.a.includes(+v) : +v===item.a; }
function rCat(b){
  const r=S.ex[b.id];
  const rows=b.items.map((it,i)=>{
    const name=b.id+'_'+i, sel=S.ans[name];
    let ctl;
    if(b.style==='select'){
      const cls = r ? (isRight(it,sel)?'ok':'bad') : '';
      ctl=`<select data-f="${name}" class="${cls}" ${r?'disabled':''} aria-label="Kies techniek"><option value="">– kies –</option>${b.cats.map((c,k)=>`<option value="${k}" ${sel==k&&sel!==''&&sel!=null?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
    } else {
      ctl=`<div class="pills" role="group">${b.cats.map((c,k)=>{
        let cls = (sel!=null && +sel===k)?'sel':'';
        if(r && +sel===k) cls = isRight(it,sel)?'ok':'bad';
        return `<button class="pill ${cls}" data-pick="${name}" data-v="${k}" ${r?'disabled':''}>${esc(c)}</button>`;
      }).join('')}</div>`;
    }
    let fb='';
    if(r){
      const ok=isRight(it,sel);
      const right = Array.isArray(it.a)? it.a.map(x=>b.cats[x]).join(' of ') : b.cats[it.a];
      fb=`<div class="cat-fb ${ok?'ok':'bad'}">${ok?'✓ Juist'+(Array.isArray(it.a)?' (ook goed: '+esc(right)+')':''):'✗ Juist antwoord: '+esc(right)}${it.ex?' · '+esc(it.ex):''}</div>`;
    }
    return `<div class="cat-row"><div class="cat-t"><span class="n">${i+1}</span>${it.t}</div>${ctl}${fb}</div>`;
  }).join('');
  return `<section class="block" data-block="${b.id}">${head(b)}${rows}${checkBar(b)}</section>`;
}
function rGap(b){
  const r=S.ex[b.id];
  const parts=gapParts(b);
  const bank = b.nobank ? '' : `<div class="bank" aria-label="Woordenbank">${shuffle(parts.filter(p=>p.g!=null).map(p=>p.alts[0]), b.id).map(w=>`<span data-bank="${b.id}" data-w="${esc(norm(w))}">${esc(w)}</span>`).join('')}</div>`;
  const txt = parts.map(p=>{
    if(p.g==null) return p.t;
    const name=b.id+'_'+p.g, v=S.ans[name]||'';
    let cls='', fix='';
    if(r){
      const ok=p.alts.some(a=>norm(a)===norm(v)); cls=ok?'ok':'bad';
      if(!ok) fix=`<span class="gapfix">→ ${esc(p.alts.slice(0,b.nobank?3:1).join(' / '))}</span>`;
      else if(b.nobank && p.alts.length>1) fix=`<span class="gapfix">(ook: ${esc(p.alts.filter(a=>norm(a)!==norm(v)).slice(0,2).join(', '))})</span>`;
    }
    return `<input type="text" data-f="${name}" value="${esc(v)}" class="${cls}" ${r?'disabled':''} aria-label="Invulveld ${p.g+1}" autocomplete="off" spellcheck="false" size="${Math.max(10, (p.alts[0]||'').length+2)}">${fix}`;
  }).join('');
  return `<section class="block" data-block="${b.id}">${head(b)}${bank}<div class="gaptext">${txt}</div>${checkBar(b)}</section>`;
}
function shuffle(arr, seed){ let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0; const a=arr.slice(); for(let i=a.length-1;i>0;i--){ h=(h*1103515245+12345)>>>0; const j=h%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function updateBank(id){
  const b=BLOCKS[id]; if(!b||b.nobank) return;
  const used = gapParts(b).filter(p=>p.g!=null).map(p=>norm(S.ans[id+'_'+p.g]));
  document.querySelectorAll(`[data-bank="${id}"]`).forEach(sp=>sp.classList.toggle('used', used.includes(sp.dataset.w)));
}
function pcVal(id){ const v=(S.ans[id]||'').trim(); return v? esc(v).replace(/\n/g,'<br>') : '<span class="pc-empty">nog leeg</span>'; }
function pitchInner(){
  return `<div class="pc-prod">${(S.ans['st1.prod']||'').trim()?esc(S.ans['st1.prod']):'<span class="pc-empty">Mijn product</span>'}</div>
  <div class="pc-slogan">${(S.ans['st5.slog']||'').trim()?'"'+esc(S.ans['st5.slog'])+'"':'mijn slogan'}</div>
  <div style="font-size:14px;margin-bottom:10px"><b>Doelgroep:</b> ${pcVal('st1.doel')}</div>
  <div class="pc-grid">
    <div class="pc-step"><b>A · Aandacht</b>${pcVal('st6.a')}</div>
    <div class="pc-step"><b>I · Interesse</b>${pcVal('st6.i')}</div>
    <div class="pc-step"><b>D · Verlangen</b>${pcVal('st6.d')}</div>
    <div class="pc-step"><b>A · Actie</b>${pcVal('st6.act')}</div>
  </div>
  <div style="font-size:14px;margin-top:10px"><b>Werkpunt:</b> ${pcVal('st1.werk')}</div>`;
}
function rPitch(b){ return `<section class="block">${head(b)}<div class="pcard" id="pitchcard">${pitchInner()}</div></section>`; }
function rTimer(b){
  const last=S.timer.last, best=S.timer.n||0;
  return `<section class="block">${head(b)}
  <div class="timer"><div class="clock" id="clock">0:00</div>
   <div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="tStart">▶ Start</button><button class="btn alt" id="tStop">■ Stop</button><button class="btn ghost" id="tReset">↺ Reset</button></div>
   <div class="zone" id="zone" style="margin-top:8px">Klaar? Start de timer en pitch hardop.</div></div></div>
   <div class="tbar"><i id="tmark"></i></div><div class="tlegend"><span>0:00</span><span>1:00</span><span>2:00</span></div>
   <p style="font-size:14px;color:var(--ink2)" id="tlog">${last!=null?`Laatste poging: ${fmt(last)} · aantal oefenpogingen: ${best}`:'Nog geen oefenpogingen.'}</p>
  </section>`;
}
function fmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function rRubric(b){
  const mode=S.rubMode||'self';
  const rows=RUBRIC.crit.map((c,i)=>`<tr><td class="crit">${esc(c.n)}</td>${c.d.map((d,k)=>{
    const r=S.rub[i]||{}; const self=r.self===k, peer=r.peer===k;
    return `<td class="cell ${self?'self':''} ${peer?'peer':''}" data-rub="${i}" data-lvl="${k}" tabindex="0" role="button" aria-pressed="${mode==='self'?self:peer}">${self?'<span class="tagme">ik</span>':''}${peer?'<span class="tagpeer">klasgenoot</span>':''}<div>${esc(d)}</div></td>`;}).join('')}</tr>`).join('');
  return `<section class="block" data-block="rubric">${head(b)}
   <div class="modes"><button data-mode="self" class="${mode==='self'?'on':''}">Ik scoor mezelf</button><button data-mode="peer" class="${mode==='peer'?'on':''}">Klasgenoot scoort mij</button></div>
   <div class="rubwrap"><table class="rub"><thead><tr><th>Criterium</th>${RUBRIC.levels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function finishInner(){
  const [ts,tm]=totals(); const p=progress();
  const got=SECTIONS.filter(s=>!s.teacher&&secDone(s)).length, all=SECTIONS.filter(s=>!s.teacher).length;

  ${p<100?'<p class="note" style="text-align:left">Er staan nog onderdelen open. Bekijk de route: briefings zonder ✓ zijn nog niet helemaal klaar.</p>':'<p class="note" style="text-align:left;background:var(--mint-l);border-color:var(--mint)">Staande ovatie! Je hebt het volledige traject afgewerkt.</p>'}`;
}
function rFinish(){
  return `<section class="block finish"><span class="chip c-tomato">Einde traject</span><h2>Je portfolio</h2><div id="finishBox">${finishInner()}</div>
   <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px"><button class="btn" data-export>Exporteer als pdf</button><button class="btn ghost" id="resetAll">Alles wissen</button></div>
   <p style="font-size:14px;color:var(--ink2);margin-top:12px">Tip: kies in het printvenster <b>Opslaan als PDF</b> als bestemming.</p></section>`;

function rLpd(){

  <div style="overflow-x:auto"><table class="lpd"><thead><tr><th>LPD</th><th>Leerplandoel</th><th>Waar in de webapp</th><th>Briefing</th><th>Dekking</th></tr></thead><tbody>
  ${LPD.map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${r[3]}</td><td><span class="cov ${cov[r[4]]}">${r[4]}</span></td></tr>`).join('')}

   <li><b>Evaluatie:</b> de pitch wordt beoordeeld met de rubric (briefing 8); de minimumvereisten voor productie (Standaardnederlands, gepast register, vaste tekststructuur AIDA, herkenbare tekstverbanden) zitten in de criteria taalgebruik en inhoud/structuur.</li>

function renderSection(id, keepScroll){
  const sec = SECTIONS.find(s=>s.id===id) || SECTIONS[0];
  S.cur = sec.id;
  const y = window.scrollY;
  const R={html:rHtml,reading:rReading,flip:rFlip,links:rLinks,open:rOpen,mc:rMC,cat:rCat,gap:rGap,pitchcard:rPitch,timer:rTimer,rubric:rRubric,finish:rFinish,lpd:rLpd};
  const idx = SECTIONS.indexOf(sec);
  const prev = SECTIONS[idx-1], next = SECTIONS[idx+1];
  const hero = `<div class="hero"><span class="kicker">${esc(sec.kicker)}</span><h1>${esc(sec.title)}</h1><p>${sec.sub}</p>
    ${sec.lpd.length?`<div class="hero-tags"><span class="lpdtag" title="Leerplandoelen (voor de leerkracht)">LPD ${sec.lpd.join(' · ')}</span></div>`:''}
    ${sec.teacher?'':`<div class="hero-sticker"></div>`}</div>`;
  const nav = `<div class="secnav">${prev?`<button class="btn alt" data-go="${prev.id}">← ${esc(prev.short)}</button>`:'<span></span>'}${next&&!next.teacher?`<button class="btn" data-go="${next.id}">${esc(next.short)} →</button>`:'<span></span>'}</div>`;
  document.getElementById('main').innerHTML = hero + sec.blocks.map(b=>R[b.type](b)).join('') + nav;
  Object.keys(BLOCKS).forEach(k=>{ if(BLOCKS[k].type==='gap') updateBank(k); });
  if(sec.blocks.some(b=>b.type==='timer')) initTimer();
  updateChrome(); save();
  if(keepScroll) window.scrollTo(0,y); else { window.scrollTo(0,0); document.getElementById('main').focus({preventScroll:true}); }
}

/* ================= CHECKING ================= */
function check(id){
  const b=BLOCKS[id]; const err=document.querySelector(`[data-err="${id}"]`);
  let score=0;
  if(b.type==='mc'){
    const miss=b.qs.findIndex((q,i)=>S.ans[id+'_'+i]==null);
    if(miss>-1){ err.textContent=`Beantwoord eerst vraag ${miss+1}.`; return; }
    b.qs.forEach((q,i)=>{ if(+S.ans[id+'_'+i]===q.a) score++; });
  } else if(b.type==='cat'){
    const miss=b.items.findIndex((q,i)=>S.ans[id+'_'+i]==null||S.ans[id+'_'+i]==='');
    if(miss>-1){ err.textContent=`Maak eerst een keuze bij nummer ${miss+1}.`; return; }
    b.items.forEach((it,i)=>{ if(isRight(it,S.ans[id+'_'+i])) score++; });
  } else if(b.type==='gap'){
    const gaps=gapParts(b).filter(p=>p.g!=null);
    const miss=gaps.findIndex(p=>!(S.ans[id+'_'+p.g]||'').trim());
    if(miss>-1){ err.textContent=`Vul eerst alle invulvelden in (veld ${miss+1} is nog leeg).`; return; }
    gaps.forEach(p=>{ if(p.alts.some(a=>norm(a)===norm(S.ans[id+'_'+p.g]))) score++; });
  }
  S.ex[id]={score, max:maxOf(b), at:Date.now()};
  renderSection(S.cur, true);
  const el=document.querySelector(`[data-block="${id}"] .checkbar`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
}

/* ================= TIMER ================= */
let tInt=null, tStart=0, tSec=0;
function initTimer(){
  clearInterval(tInt); tInt=null; tSec=0; drawTimer();
  document.getElementById('tStart').onclick=()=>{ if(tInt) return; tStart=Date.now()-tSec*1000; tInt=setInterval(()=>{ tSec=Math.floor((Date.now()-tStart)/1000); drawTimer(); },250); };
  document.getElementById('tStop').onclick=()=>{ if(!tInt) return; clearInterval(tInt); tInt=null; S.timer.last=tSec; S.timer.n=(S.timer.n||0)+1; save(); document.getElementById('tlog').textContent=`Laatste poging: ${fmt(tSec)} · aantal oefenpogingen: ${S.timer.n}`; };
  document.getElementById('tReset').onclick=()=>{ clearInterval(tInt); tInt=null; tSec=0; drawTimer(); };
}
function drawTimer(){
  const c=document.getElementById('clock'); if(!c) return;
  c.textContent=fmt(tSec);
  c.className='clock '+(tSec===0?'':tSec<60?'short':tSec<=120?'good':'long');
  const z=document.getElementById('zone');
  z.textContent = tSec===0?'Klaar? Start de timer en pitch hardop.': tSec<60?'Nog wat te kort: werk je argumenten verder uit.': tSec<=120?'Perfecte lengte!':'Te lang: schrap wat niet nodig is.';
  document.getElementById('tmark').style.left = Math.min(100, tSec/120*100)+'%';
}

/* ================= EVENTS ================= */
const main=document.getElementById('main');
let chromeT;
main.addEventListener('input', e=>{
  const f=e.target.dataset.f; if(!f) return;
  S.ans[f]=e.target.value;
  if(e.target.dataset.words){ const w=e.target.dataset.words.split(',').map(Number); const wc=document.querySelector(`[data-wc="${f}"]`); wc.textContent=wcText(e.target.value,w); wc.classList.toggle('ok',wcOk(e.target.value,w)); }
  const bid=f.split(/[._]/)[0];
  if(BLOCKS[bid] && BLOCKS[bid].type==='gap') updateBank(bid);
  const pc=document.getElementById('pitchcard'); if(pc && /^st[156]\./.test(f)) pc.innerHTML=pitchInner();
  const er=document.querySelector(`[data-err="${bid}"]`); if(er) er.textContent='';
  save(); clearTimeout(chromeT); chromeT=setTimeout(updateChrome,300);
});
main.addEventListener('change', e=>{
  const t=e.target, f=t.dataset.f; if(!f) return;
  if(t.type==='radio'){ S.ans[f]=+t.value; t.closest('.q').querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel', o.contains(t))); }
  else S.ans[f]=t.value;
  const bid=f.split('_')[0]; const er=document.querySelector(`[data-err="${bid}"]`); if(er) er.textContent='';
  save();
});
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-rub]'); if(!t) return;
  if(t.dataset.go){ renderSection(t.dataset.go); closeSide(); return; }
  if(t.hasAttribute('data-flip')){ t.classList.toggle('on'); return; }
  if(t.dataset.pick){ S.ans[t.dataset.pick]=+t.dataset.v; t.parentElement.querySelectorAll('.pill').forEach(p=>p.classList.toggle('sel',p===t)); const er=document.querySelector(`[data-err="${t.dataset.pick.split('_')[0]}"]`); if(er) er.textContent=''; save(); return; }
  if(t.dataset.check){ check(t.dataset.check); return; }
  if(t.dataset.retry){ delete S.ex[t.dataset.retry]; renderSection(S.cur,true); return; }
  if(t.dataset.mode){ S.rubMode=t.dataset.mode; renderSection(S.cur,true); return; }
  if(t.dataset.rub!=null){ rubPick(t); return; }
  if(t.hasAttribute('data-export')||t.id==='exportTop'){ exportPdf(); return; }
  if(t.id==='resetAll'){ if(t.dataset.sure){ try{localStorage.removeItem(KEY);}catch(_){}; S={ans:{},ex:{},rub:{},cur:'welkom',rubMode:'self',timer:{}}; renderSection('welkom'); } else { t.dataset.sure='1'; t.textContent='Zeker? Klik nog eens om alles te wissen'; } return; }
  if(t.id==='sideToggle'){ const s=document.getElementById('side'); s.classList.toggle('open'); t.setAttribute('aria-expanded', s.classList.contains('open')); return; }
});
main.addEventListener('keydown', e=>{ const t=e.target; if(t.dataset && t.dataset.rub!=null && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); rubPick(t);} });
function rubPick(t){
  const i=+t.dataset.rub, k=+t.dataset.lvl, m=S.rubMode||'self';
  S.rub[i]=S.rub[i]||{}; S.rub[i][m] = S.rub[i][m]===k? null : k;
  renderSection(S.cur,true);
}
function closeSide(){ const s=document.getElementById('side'); s.classList.remove('open'); document.getElementById('sideToggle').setAttribute('aria-expanded','false'); }

/* ================= EXPORT ================= */
function ansBlock(v){ return (v||'').trim()? `<div class="ans">${esc(v)}</div>` : `<div class="ans muted">niet ingevuld</div>`; }
function exportPdf(){
  const [ts,tm]=totals();
  const date=new Date().toLocaleDateString('nl-BE',{day:'numeric',month:'long',year:'numeric'});
  let h=`<h1>Bureau Overtuig · portfolio</h1>
  <p><b>Naam:</b> ${esc(S.ans['id.naam']||'')} &nbsp; <b>Klas:</b> ${esc(S.ans['id.klas']||'')} &nbsp; <b>Datum:</b> ${date}</p>
  <p><b>Voortgang:</b> ${progress()}% &nbsp; <b>Totaalscore gesloten oefeningen:</b> ${ts}/${tm} &nbsp; <b>Stickers:</b> ${SECTIONS.filter(s=>!s.teacher&&secDone(s)).map(s=>esc(s.sticker.name)).join(', ')||'–'}</p>
  <h2>Scorelijst</h2><table><tr><th>Briefing</th><th>Oefening</th><th>Score</th></tr>`;
  SECTIONS.forEach(s=>s.blocks.forEach(b=>{ if(['mc','cat','gap'].includes(b.type)){ const r=S.ex[b.id]; h+=`<tr><td>${esc(s.short)}</td><td>${esc(strip(b.title))}</td><td>${r?r.score+'/'+maxOf(b):'niet verbeterd'}</td></tr>`; } }));
  h+=`</table>`;
  SECTIONS.filter(s=>!s.teacher).forEach(s=>{
    const items = s.blocks.filter(b=>['open','mc','cat','gap','rubric'].includes(b.type) && b.id!=='id');
    if(!items.length) return;
    h+=`<div class="sec"><h2>${esc(s.kicker)} · ${esc(s.title)}</h2><p class="muted" style="font-size:9pt">Leerplandoelen: LPD ${s.lpd.join(', ')}</p>`;
    items.forEach(b=>{
      h+=`<div class="item"><h3>${esc(strip(b.title))}${S.ex[b.id]?` · score ${S.ex[b.id].score}/${maxOf(b)}`:''}</h3>`;
      if(b.type==='open') b.fields.forEach(f=>{ h+=`<div class="lbl">${esc(f.label)}</div>${ansBlock(S.ans[fid(b,f)])}`; });
      if(b.type==='mc'){ h+='<table>'; b.qs.forEach((q,i)=>{ const v=S.ans[b.id+'_'+i]; const ok=v!=null&&+v===q.a; h+=`<tr><td style="width:50%">${i+1}. ${esc(q.q)}</td><td>${v!=null?esc(q.o[v]):'<span class="muted">–</span>'}</td><td class="${S.ex[b.id]?(ok?'ok':'bad'):''}">${S.ex[b.id]?(ok?'✓':'✗ '+esc(q.o[q.a])):''}</td></tr>`; }); h+='</table>'; }
      if(b.type==='cat'){ h+='<table>'; b.items.forEach((it,i)=>{ const v=S.ans[b.id+'_'+i]; const has=v!=null&&v!==''; const ok=has&&isRight(it,v); h+=`<tr><td style="width:55%">${esc(strip(it.t))}</td><td>${has?esc(b.cats[v]):'<span class="muted">–</span>'}</td><td class="${S.ex[b.id]?(ok?'ok':'bad'):''}">${S.ex[b.id]?(ok?'✓':'✗'):''}</td></tr>`; }); h+='</table>'; }
      if(b.type==='gap'){ h+='<table>'; gapParts(b).filter(p=>p.g!=null).forEach(p=>{ const v=S.ans[b.id+'_'+p.g]||''; const ok=p.alts.some(a=>norm(a)===norm(v)); h+=`<tr><td>${p.g+1}</td><td>${esc(v)||'<span class="muted">–</span>'}</td><td class="${S.ex[b.id]?(ok?'ok':'bad'):''}">${S.ex[b.id]?(ok?'✓':'✗ '+esc(p.alts[0])):''}</td></tr>`; }); h+='</table>'; }
      if(b.type==='rubric'){ h+=`<table><tr><th>Criterium</th><th>Ik</th><th>Klasgenoot</th></tr>${RUBRIC.crit.map((c,i)=>{const r=S.rub[i]||{}; return `<tr><td>${esc(c.n)}</td><td>${r.self!=null?RUBRIC.levels[r.self]:'–'}</td><td>${r.peer!=null?RUBRIC.levels[r.peer]:'–'}</td></tr>`;}).join('')}</table>`; }
      h+=`</div>`;
    });
    if(s.id==='pitch' && S.timer.last!=null) h+=`<p><b>Oefentimer:</b> laatste poging ${fmt(S.timer.last)}, ${S.timer.n} oefenpogingen.</p>`;
    h+=`</div>`;
  });
  document.getElementById('report').innerHTML=h;
  const old=document.title; document.title='Portfolio Bureau Overtuig - '+(S.ans['id.naam']||'leerling');
  setTimeout(()=>{ window.print(); document.title=old; },60);
}

/* ================= START ================= */
renderSection(S.cur||'welkom');
</script>
